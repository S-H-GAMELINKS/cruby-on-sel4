# GRUB configuration for booting seL4 over UEFI.
#
# The kernel is entered through multiboot2 rather than multiboot1. That choice is
# forced by UEFI: try_boot_sys_mbi1 finds the ACPI RSDP by scanning the BIOS area
# (acpi.c:186-193), which holds nothing on a UEFI machine, while try_boot_sys_mbi2
# takes the RSDP straight from the tags GRUB supplies (boot_sys.c:631-638).
#
# gfxpayload is what decides whether a framebuffer exists at all. seL4's
# multiboot2 header carries no framebuffer request tag -- it is magic plus an end
# tag and nothing else (multiboot.S:61-74) -- so the mode comes from GRUB's side,
# and GRUB then reports it back in a framebuffer tag that boot_sys.c:684 picks up.

set timeout=3
set default=0

insmod part_gpt
insmod fat
insmod all_video
insmod gfxterm

# The image lives on whichever partition carries the payload, which is not
# necessarily the one this configuration was loaded from.
search --no-floppy --file --set=root /sel4/kernel

# An external display, which is what a presentation runs on and what the Deck's
# firmware drives to the exclusion of its own panel once one is connected. The
# mode has to match what the assembly was told, because the framebuffer's shape
# is written down there rather than discovered.
menuentry 'seL4 CRuby (external display, 1920x1080x32)' {
    set gfxpayload=1920x1080x32
    multiboot2 /sel4/kernel
    module2 /sel4/capdl-loader capdl-loader
    boot
}

# The Steam Deck's internal panel, in its own orientation. The framebuffer is
# portrait; the console turns what it draws to match, which GRUB's own menu does
# not, so the menu appears on its side and the slides do not.
menuentry 'seL4 CRuby (Steam Deck, 800x1280x32)' {
    set gfxpayload=800x1280x32
    multiboot2 /sel4/kernel
    module2 /sel4/capdl-loader capdl-loader
    boot
}

# QEMU with OVMF, in the mode run-ovmf.sh sets up.
menuentry 'seL4 CRuby (1280x800x32)' {
    set gfxpayload=1280x800x32
    multiboot2 /sel4/kernel
    module2 /sel4/capdl-loader capdl-loader
    boot
}

# Let GRUB pick. Useful when the fixed mode is not in the firmware's mode list,
# which is the likely outcome on an unfamiliar panel or an external display.
menuentry 'seL4 CRuby (auto)' {
    set gfxpayload=auto
    multiboot2 /sel4/kernel
    module2 /sel4/capdl-loader capdl-loader
    boot
}

# Keep whatever mode the firmware left set. This is the fallback that avoids a
# mode switch entirely, and on HDMI it keeps the display the firmware chose.
menuentry 'seL4 CRuby (keep firmware mode)' {
    set gfxpayload=keep
    multiboot2 /sel4/kernel
    module2 /sel4/capdl-loader capdl-loader
    boot
}

# What to run on a machine whose display is not known yet.
#
# The kernel reports the mode it was handed, but only over the serial port, and
# the Steam Deck has none. GRUB draws on the display itself, so asking it works
# anywhere -- including on a panel mounted sideways, where the answer arrives on
# its side but arrives.
#
# This gives the modes, not the framebuffer address: GRUB has no command that
# reports one, and the framebuffer does not appear in the EFI memory map either.
# Boot in steps, so that a failure has a side.
#
# Without a serial port there is no way to tell a loader that gave up from a
# kernel that died: both leave the screen as it was. Pausing between the two
# separates them. If an error appears before the pause, GRUB never handed
# control over; if the pause is reached and the screen then stops changing, the
# kernel had it and stopped -- seL4's fail() is a halt loop, so a frozen screen
# is what a kernel that refused to boot looks like.
menuentry 'seL4 CRuby (step by step)' {
    set gfxpayload=1920x1080x32
    echo 'loading kernel...'
    multiboot2 /sel4/kernel
    echo 'loading capdl-loader...'
    module2 /sel4/capdl-loader capdl-loader
    echo
    echo 'Both loaded. Press a key to hand over to seL4.'
    echo 'Anything after this point is the kernel, not GRUB.'
    read _
    boot
}

menuentry 'Show video modes' {
    insmod videoinfo
    videoinfo
    echo
    echo 'Copy the current mode into ruby.camkes as fb_width, fb_height and'
    echo 'pitch. videoinfo does not report the framebuffer address; read that'
    echo 'from SteamOS with: dmesg | grep -i efifb'
    echo
    echo 'Press a key to return to the menu.'
    read _
}

menuentry 'Firmware setup' {
    fwsetup
}
